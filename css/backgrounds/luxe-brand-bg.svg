<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="lx-emerald-core" cx="50%" cy="40%" r="35%" fx="50%" fy="40%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#22C55E" stop-opacity="0.08"/>
      <stop offset="75%" stop-color="#16A34A" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#16A34A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lx-emerald-left" cx="20%" cy="30%" r="30%" fx="20%" fy="30%">
      <stop offset="0%" stop-color="#86EFAC" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#22C55E" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lx-emerald-right" cx="80%" cy="25%" r="25%" fx="80%" fy="25%">
      <stop offset="0%" stop-color="#D1FAE5" stop-opacity="0.09"/>
      <stop offset="50%" stop-color="#22C55E" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="lx-x-line-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22C55E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#16A34A" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="lx-x-line-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>

    <filter id="lx-soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#0B0B0D"/>

