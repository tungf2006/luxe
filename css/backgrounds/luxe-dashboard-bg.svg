<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="emerald-core" cx="50%" cy="40%" r="35%" fx="50%" fy="40%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.15"/>
      <stop offset="45%" stop-color="#22C55E" stop-opacity="0.06"/>
      <stop offset="75%" stop-color="#16A34A" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#16A34A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emerald-left" cx="20%" cy="30%" r="30%" fx="20%" fy="30%">
      <stop offset="0%" stop-color="#86EFAC" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#22C55E" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emerald-right" cx="80%" cy="25%" r="25%" fx="80%" fy="25%">
      <stop offset="0%" stop-color="#D1FAE5" stop-opacity="0.07"/>
      <stop offset="50%" stop-color="#22C55E" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="growth-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22C55E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="growth-line-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#0B0B0D"/>

  <rect width="1600" height="900" fill="url(#emerald-core)" opacity="0.7"/>
  <rect width="1600" height="900" fill="url(#emerald-left)" opacity="0.5"/>
  <rect width="1600" height="900" fill="url(#emerald-right)" opacity="0.4"/>

  <path d="M120 720 C280 680 380 760 540 710 C700 660 820 700 980 670 C1140 640 1260 690 1420 650"
        fill="none" stroke="url(#growth-line-grad)" stroke-width="1.5" opacity="0.45" filter="url(#soft-glow)"/>

  <path d="M80 760 C220 720 340 780 500 740 C660 700 760 740 920 720 C1080 700 1200 740 1360 700"
        fill="none" stroke="url(#growth-line-grad-2)" stroke-width="1" opacity="0.35" filter="url(#soft-glow)"/>

  <path d="M100 800 C240 760 360 810 520 780 C680 750 780 790 940 760 C1100 730 1220 770 1380 730"
        fill="none" stroke="url(#growth-line-grad)" stroke-width="1" opacity="0.25" filter="url(#soft-glow)"/>

  <path d="M0 680 Q400 620 800 650 T1600 620"
        fill="none" stroke="#22C55E" stroke-width="0.5" stroke-opacity="0.08" stroke-dasharray="4 4"/>

  <path d="M0 730 Q400 690 800 710 T1600 680"
        fill="none" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.06" stroke-dasharray="6 3"/>

  <circle cx="320" cy="380" r="60" fill="url(#emerald-left)" opacity="0.3" filter="url(#subtle-glow)"/>
  <circle cx="1280" cy="340" r="45" fill="url(#emerald-right)" opacity="0.25" filter="url(#subtle-glow)"/>
  <circle cx="800" cy="500" r="20" fill="#22C55E" opacity="0.15" filter="url(#subtle-glow)"/>

  <circle cx="380" cy="420" r="3" fill="#22C55E" opacity="0.4"/>
  <circle cx="400" cy="440" r="2" fill="#22C55E" opacity="0.35"/>
  <circle cx="420" cy="465" r="3" fill="#22C55E" opacity="0.3"/>
  <circle cx="445" cy="485" r="2" fill="#22C55E" opacity="0.35"/>
  <circle cx="470" cy="510" r="3" fill="#22C55E" opacity="0.3"/>

  <circle cx="1240" cy="280" r="2" fill="#86EFAC" opacity="0.3"/>
  <circle cx="1260" cy="300" r="2" fill="#86EFAC" opacity="0.25"/>
  <circle cx="1280" cy="325" r="2" fill="#86EFAC" opacity="0.3"/>
  <circle cx="1300" cy="345" r="3" fill="#86EFAC" opacity="0.25"/>

  <rect x="200" y="580" width="4" height="20" fill="#22C55E" opacity="0.12" rx="2"/>
  <rect x="212" y="570" width="4" height="30" fill="#22C55E" opacity="0.15" rx="2"/>
  <rect x="224" y="560" width="4" height="40" fill="#22C55E" opacity="0.2" rx="2"/>
  <rect x="236" y="570" width="4" height="30" fill="#22C55E" opacity="0.15" rx="2"/>
  <rect x="248" y="575" width="4" height="25" fill="#22C55E" opacity="0.18" rx="2"/>
  <rect x="260" y="565" width="4" height="35" fill="#22C55E" opacity="0.15" rx="2"/>
  <rect x="272" y="580" width="4" height="20" fill="#22C55E" opacity="0.12" rx="2"/>

  <rect x="620" y="590" width="4" height="15" fill="#38BDF8" opacity="0.1"/>
  <rect x="630" y="585" width="4" height="20" fill="#38BDF8" opacity="0.12" rx="2"/>
  <rect x="640" y="580" width="4" height="25" fill="#38BDF8" opacity="0.1" rx="2"/>
  <rect x="650" y="575" width="4" height="30" fill="#38BDF8" opacity="0.08" rx="2"/>

  <path d="M1420 420 Q1460 380 1500 420 T1560 420"
        fill="none" stroke="#86EFAC" stroke-width="1" opacity="0.2" stroke-linecap="round"/>

  <path d="M120 500 Q160 460 200 500 T280 500"
        fill="none" stroke="#D1FAE5" stroke-width="1" opacity="0.15" stroke-linecap="round"/>
</svg>
